[project]
name = "marketplace-parser"
version = "1.0.0"
description = "Collects products, prices and reviews from Wildberries and Ozon into Excel"
requires-python = ">=3.12"
dependencies = ["patchright", "customtkinter", "openpyxl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "RUF"]
ignore = [
    "RUF001", # Cyrillic letters in strings look like Latin ones to the linter
    "RUF002",
    "RUF003",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]
"tools/*" = ["T201"]
