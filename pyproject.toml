[project]
name = "mpparser"
version = "2.0.0"
description = "Collects products, prices and reviews from Wildberries, Ozon and Yandex Market into Excel"
requires-python = ">=3.12"
dependencies = ["patchright", "customtkinter", "openpyxl"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mpparser*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "RUF"]
ignore = [
    "RUF001", # Cyrillic letters in strings look like Latin ones to the linter
    "RUF002",
    "RUF003",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]  # stub parsers in tests do not use their arguments
"tools/*" = ["T201"]
